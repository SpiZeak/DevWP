; CLI-only ini for WP-CLI invocations — the error_reporting value DevWP
; previously passed as `php -d error_reporting=...` (WP_CLI_ERROR_REPORTING
; in src/backend/wp_cli.rs). The php shim adds this scan dir because
; `frankenphp php-cli` does not support -d.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_WARNING
