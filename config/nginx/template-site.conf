server {
	listen 443 quic;
	listen 443 ssl;

	server_name example.com;
	root /src/www/example.com;

	ssl_certificate /certs/cert.pem;
	ssl_certificate_key /certs/key.pem;
	ssl_trusted_certificate /certs/ca.pem;

	include global/restrictions.conf;

	# Additional rules go here.

	# Only include one of the files below.
	include global/wordpress.conf;
	# include global/wordpress-ms-subdir.conf;
	# include global/wordpress-ms-subdomain.conf;


	# On-demand image sizes (avif-express): fall back to WordPress when an
	# intermediate size file is missing so it can be generated on the fly.
	location ~* ^/(?:app|wp-content)/uploads/(.+)-(\d+)x(\d+)\.(jpe?g|png)$ {
		try_files $uri /index.php?od_image=$1&od_w=$2&od_h=$3&od_ext=$4;
	}

	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
		log_not_found off;
	}
}
