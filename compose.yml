x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mariadb:
    container_name: devwp_mariadb
    # Floating tag: latest advances to new majors on its own; downgrading an
    # existing data volume to an older major line is not supported.
    image: mariadb:latest
    environment:
      # Sites connect from the php container over TCP as root; must stay '%' or
      # fresh volume initialization refuses them (root@localhost only).
      MARIADB_ROOT_HOST: '%'
      # Must match DB_ROOT_PASSWORD / DB_ROOT_USER in src/backend/utils.rs
      MARIADB_ROOT_PASSWORD: root
      MARIADB_AUTO_UPGRADE: true
      TZ: Europe/Stockholm
    volumes:
      - mariadb:/var/lib/mysql
      - ./config/mariadb/files:/src:ro
    ports:
      # Loopback only: a dev DB with root/root must not listen on the LAN.
      - '127.0.0.1:3306:3306'
    tmpfs:
      - /tmp
    command: --bind-address=0.0.0.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-name-resolve --innodb-flush-log-at-trx-commit=2 --innodb-flush-method=O_DIRECT --innodb-buffer-pool-size=2G --tmp-table-size=64M --max-heap-table-size=64M
    # Dev DB on a 31 GB host: the 2G pool keeps ~30 sites' option/meta reads
    # memory-resident; dev-tuned flush settings trade durability for speed.
    # Guardrail so per-connection buffers can never pressure the host into swap.
    mem_limit: 4g
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: devwp_redis
    image: redis:alpine
    ports:
      - '127.0.0.1:6379:6379'
    # Object cache only: bound it (LRU eviction, never error on writes) and
    # skip RDB snapshots — a rebuildable cache must not grow until host swap
    # pressure, nor spend disk I/O persisting.
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
    volumes:
      - redis:/data
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    container_name: devwp_web
    build:
      context: ./config/frankenphp
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    ports:
      - '80:80'
      - '443:443/tcp'
      - '443:443/udp'
    volumes:
      - ./config/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./config/frankenphp/sites-enabled/:/etc/frankenphp/Caddyfile.d/:rw
      - ./config/frankenphp/workers/:/etc/frankenphp/workers:rw
      - ./config/frankenphp/php.ini:/usr/local/etc/php/php.ini:ro
      - ./config/frankenphp/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/zz-devwp-xdebug.ini
      - ./config/frankenphp/conf.d/opcache.ini:/usr/local/etc/php/conf.d/zz-devwp-opcache.ini:ro
      - ./config/certs:/certs:ro
      - ~/www:/src/www:rw
      - ~/.ssh:/home/appuser/.ssh:ro
      - ~/.config/composer:/home/appuser/.config/composer:ro
    tmpfs:
      # Root-owned tmpfs keeps Caddy state out of named volumes; the global
      # Caddyfile relocates storage to /tmp/caddy so nothing writes here.
      - /data
      - /config
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    logging: *default-logging
    # Guardrail: 16 PHP threads x up to 1G memory_limit could otherwise
    # pressure a 31 GB host into swap under pathological load.
    mem_limit: 4g
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:2019/config/ >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      # The first wp-admin boot compiles WordPress into opcache.
      start_period: 40s

  mailpit:
    container_name: devwp_mailpit
    image: axllent/mailpit:latest
    expose:
      - '1025' # smtp server
    ports:
      - '127.0.0.1:8025:8025' # web ui
    environment:
      - TZ=Europe/Stockholm
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mariadb:
  redis:
