name: Pull Request Checks

on:
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run linting
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --lib --bins
        timeout-minutes: 10

      - name: Check for debug statements
        run: |
          if grep -rE "dbg!|println!|eprintln!|console\.log" src --include='*.rs'; then
            echo "Warning: Found debug statements. Consider using the tracing logger."
          fi
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    uses: ./.github/workflows/integration-tests.yml

  test-docker:
    name: Test Docker Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Check Docker image builds
        run: |
          docker compose build --no-cache nginx
          docker compose build --no-cache php
        timeout-minutes: 30

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Rust security audit
        run: cargo audit
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  pr-comment:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs:
      [validate, integration-tests, test-docker, security-check]
    if: always()

    steps:
      - name: PR Summary Comment
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const summary = Object.entries(jobs)
              .map(([name, job]) => `- ${name}: ${job.result}`)
              .join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## PR Checks Summary\n\n${summary}\n\n✅ All checks must pass before merging.`
            });
