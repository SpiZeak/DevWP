name: Update Dependencies

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2 AM UTC
  workflow_dispatch: # Optional manual trigger

# Add permissions block to allow pushing changes
permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf

      - name: Update Cargo dependencies
        run: cargo update

      - name: Run unit tests
        run: cargo test --lib --bins
        timeout-minutes: 10

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test build
        run: cargo build --release
        timeout-minutes: 20

      - name: Commit changes
        id: commit
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add Cargo.toml Cargo.lock # Be specific about files to add
          # Check if there are staged changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes_exist=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected, committing..."
            git commit -m "chore: Auto-update dependencies and lockfiles"
            echo "changes_exist=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        # Only run if the commit step detected changes
        if: steps.commit.outputs.changes_exist == 'true'
        run: |
          echo "Pushing changes..."
          # Explicitly push to the branch the workflow is running on
          git push origin HEAD:${{ github.ref_name }}
