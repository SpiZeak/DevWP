name: Update Dependencies

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2 AM UTC
  workflow_dispatch: # Optional manual trigger

# Dependency updates go through a pull request so the full CI gate
# (including integration tests) runs before anything reaches the default
# branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf

      - name: Update Cargo dependencies
        run: cargo update

      - name: Run unit tests
        run: cargo test --lib --bins
        timeout-minutes: 10

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test build
        run: cargo build --release
        timeout-minutes: 20

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          BRANCH="deps/auto-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-update dependencies"
          git push origin HEAD:"$BRANCH"
          gh pr create \
            --title "chore: auto-update dependencies" \
            --body "Automated \`cargo update\` from the scheduled workflow. The full CI gate (including integration tests) runs on this PR before merging." \
            --base "$BASE" || echo "PR already open, pushed new commits"
