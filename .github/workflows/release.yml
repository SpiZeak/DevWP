name: Build and Release DevWP

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            platform: macos-14 # Apple Silicon
          - name: linux-x86_64
            platform: ubuntu-24.04
          - name: linux-aarch64
            platform: ubuntu-24.04-arm
          - name: windows-x86_64
            platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf xdg-utils file desktop-file-utils

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
        timeout-minutes: 20

      - name: Package application
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release
        timeout-minutes: 30

      # Explicitly use bash: Windows runners default to PowerShell, where
      # `ls -lh` is an unknown Get-ChildItem parameter and -lh raises a
      # terminating error that aborts the step before the fallback can run.
      - name: List packaged artifacts
        shell: bash
        run: ls -lh target/release/*.AppImage target/release/*.deb target/release/*.dmg target/release/*-setup.exe target/release/*.msi 2>/dev/null || ls -lh target/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: devwp-${{ matrix.name }}
          path: |
            target/release/*.AppImage
            target/release/*.deb
            target/release/*.dmg
            target/release/*-setup.exe
            target/release/*.msi
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs: [package]
    runs-on: ubuntu-latest
    # Only tag pushes produce releases; dispatching on a branch would create a
    # release named after the branch and cascade into a broken AUR deploy.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          merge-multiple: true

      # Artifacts are named with the plain package version (e.g.
      # devwp_0.3.3_x86_64.AppImage), so strip the v prefix from the tag.
      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DevWP ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: release-artifacts/*
          body: |
            ## Installation

            ### Windows
            - **x64 installer**: Download `devwp_${{ steps.version.outputs.VERSION }}_x64-setup.exe` and run it.
            - **x64 MSI**: Download `devwp_${{ steps.version.outputs.VERSION }}_x64_en-US.msi` and run it.

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: Download `DevWP_${{ steps.version.outputs.VERSION }}_aarch64.dmg`, open it, and drag DevWP to Applications.

            ### Linux
            - **AppImage (x86_64)**: Download `devwp_${{ steps.version.outputs.VERSION }}_x86_64.AppImage`, make it executable (`chmod +x`), and run it.
            - **Deb (x86_64)**: Download `devwp_${{ steps.version.outputs.VERSION }}_amd64.deb` and install with `sudo dpkg -i devwp_${{ steps.version.outputs.VERSION }}_amd64.deb`.
            - **AppImage (ARM64)**: Download `devwp_${{ steps.version.outputs.VERSION }}_aarch64.AppImage`, make it executable (`chmod +x`), and run it.
            - **Deb (ARM64)**: Download `devwp_${{ steps.version.outputs.VERSION }}_arm64.deb` and install with `sudo dpkg -i devwp_${{ steps.version.outputs.VERSION }}_arm64.deb`.

            > **Requirement**: [Docker Desktop](https://www.docker.com/products/docker-desktop/) must be installed and running.
