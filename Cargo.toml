[package]
name = "devwp"
version = "0.5.0"
description = "DevWP – simplified local WordPress development with Docker, Nginx, and PHP-FPM"
authors = ["Trewhitt"]
repository = "https://github.com/SpiZeak/DevWP"
license = "MIT"
edition = "2021"
rust-version = "1.83"

[lib]
name = "devwp"
path = "src/lib.rs"

[[bin]]
name = "devwp"
path = "src/main.rs"

[dependencies]
bollard = "0.21.1"
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
dioxus = { version = "0.7.10", features = ["desktop"] }
futures-util = "0.3"
http-body-util = "0.1.5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
tar = "0.4"
tokio = { version = "1", features = ["full", "rt"] }
tracing = "0.1"

# cargo-packager (see https://docs.rs/cargo-packager/latest/cargo_packager/config/struct.Config.html)
# Artifact naming (binary name "devwp", product name "DevWP"):
#   AppImage: devwp_<version>_x86_64.AppImage   deb: devwp_<version>_amd64.deb
#   NSIS:     devwp_<version>_x64-setup.exe     MSI: devwp_<version>_x64_en-US.msi
#   DMG:      DevWP_<version>_aarch64.dmg
[package.metadata.packager]
name = "devwp"
version = "0.5.0"
description = "DevWP – simplified local WordPress development with Docker, Nginx, and PHP-FPM"
homepage = "https://github.com/SpiZeak/DevWP"
authors = ["Trewhitt"]
identifier = "com.devwp.app"
product_name = "DevWP"
category = "DeveloperTool"
before_packaging_command = "cargo build --release"
icons = ["resources/icon.png", "build/icon.icns", "build/icon.ico"]

# Linux package extras: install a freedesktop-compliant launcher and the icon
# at XDG hicolor locations so the auto-generated {{icon}} lookup resolves.
# `files` is a src-path -> dst-path mapping relative to the package root
# (/usr for deb, AppDir/ for AppImage).
[package.metadata.packager.deb]
files = { "resources/devwp.desktop" = "/usr/share/applications/devwp.desktop", "resources/icon.png" = "/usr/share/icons/hicolor/512x512/apps/devwp.png" }

[package.metadata.packager.appimage]
files = { "resources/devwp.desktop" = "usr/share/applications/devwp.desktop", "resources/icon.png" = "usr/share/icons/hicolor/512x512/apps/devwp.png" }


